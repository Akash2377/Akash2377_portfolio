# Netlify builds and serves this site. `npm run build` is the full pipeline:
# type-check, Vite build, prerender to static HTML, then generate the canonical
# tags, JSON-LD, sitemap, robots.txt and llms.txt.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Content-hashed assets never change under the same name, so they can be cached
# forever. Everything else is revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
